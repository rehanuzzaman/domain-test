<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Website</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --tag-bg: #eff6ff;
      --tag-text: #1d4ed8;
    }

    body.dark {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
      --primary: #3b82f6;
      --primary-hover: #60a5fa;
      --tag-bg: #1e3a8a;
      --tag-text: #93c5fd;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      transition: background-color 0.2s, color 0.2s, border-color 0.2s;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 1rem 2rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--card-bg);
    }

    .brand {
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: -0.02em;
    }

    .theme-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .theme-btn:hover {
      background: var(--tag-bg);
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2.5rem;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      background-color: var(--tag-bg);
      color: var(--tag-text);
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: 1.75rem;
      margin-bottom: 0.75rem;
      letter-spacing: -0.02em;
    }

    p {
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 1.75rem;
      font-size: 0.95rem;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .btn {
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      font-weight: 500;
      cursor: pointer;
      font-size: 0.95rem;
    }

    .btn:hover {
      background-color: var(--primary-hover);
    }

    .counter-display {
      font-size: 0.9rem;
      color: var(--muted);
    }

    .counter-display span {
      font-weight: 600;
      color: var(--text);
    }

    footer {
      text-align: center;
      padding: 1.25rem;
      font-size: 0.85rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">Lab/Test</div>
    <button class="theme-btn" id="themeToggle">Dark Mode</button>
  </header>

  <main>
    <div class="card">
      <span class="badge">Development Environment</span>
      <h1>Test Website</h1>
      <p>
        এটি একটি সাধারণ টেস্ট ওয়েবসাইট। এই সিঙ্গেল ফাইলে HTML স্ট্রাকচার, CSS স্টাইলিং এবং JavaScript লজিক একসাথে রাখা হয়েছে।
      </p>

      <div class="controls">
        <button class="btn" id="testBtn">Click me</button>
        <div class="counter-display">
          Clicks: <span id="clickCount">0</span>
        </div>
      </div>
    </div>
  </main>

  <footer>
    Status: All systems operational
  </footer>

  <script>
    // Counter functionality
    let count = 0;
    const testBtn = document.getElementById('testBtn');
    const clickCount = document.getElementById('clickCount');

    testBtn.addEventListener('click', () => {
      count++;
      clickCount.textContent = count;
    });

    // Theme toggle functionality
    const themeToggle = document.getElementById('themeToggle');
    const body = document.body;

    themeToggle.addEventListener('click', () => {
      body.classList.toggle('dark');
      const isDark = body.classList.contains('dark');
      themeToggle.textContent = isDark ? 'Light Mode' : 'Dark Mode';
    });
  </script>
</body>
</html>
